# ============================================================
# TDLib Media Uploader V1.8.10
#
# 首次使用：
#   1. 复制本文件为 config.toml
#   2. 填写 Telegram API、目标群/Topic 或频道和本地目录
#
# 各平台 setup / run 脚本在发现 config.toml 不存在时也会自动创建。
#
# 路径支持绝对路径和 ~；Windows 也可以使用单引号保存反斜杠。
# ============================================================


[telegram]

# 在 https://my.telegram.org/ 获取
api_id = 12345678
api_hash = "YOUR_API_HASH"

# Telegram 超级群 Chat ID，例如 -1001234567890
chat_id = -1001234567890

# Forum Topic ID
forum_topic_id = 12345

# 目标模式：forum_topic（超级群组话题）或 channel（频道）
target_mode = "forum_topic"

# 频道 Chat ID。选择 channel 时必须填写；选择 forum_topic 时可保持 0。
channel_chat_id = 0

# 可选：分别为视频和图片覆盖 Telegram 目标。
# 未填写对应小节时，该上传类型继承上面 [telegram] 的公共目标。
# GUI 的“视频上传”和“图片上传”页面也可以分别编辑这里的目标。
#
# [telegram.video]
# target_mode = "forum_topic"
# chat_id = -1001234567890
# channel_chat_id = 0
# forum_topic_id = 12345
#
# [telegram.image]
# target_mode = "channel"
# chat_id = -1001234567890
# channel_chat_id = -1009876543210
# forum_topic_id = 0


[proxy]

# 独立的 Telegram 网络代理设置。默认关闭，关闭时使用直连。
# type 可选："socks5"、"http"、"mtproto"
enabled = false
type = "socks5"
server = ""
port = 1080

# SOCKS5 / HTTP 可选认证；MTProto 不使用下面两个字段。
username = ""
password = ""

# MTProto 代理的十六进制 secret；仅 type = "mtproto" 时填写。
secret = ""

# HTTP 代理只支持普通 HTTP 请求时设为 true；一般保持 false。
http_only = false


[paths]

# 会递归扫描所有子文件夹
video_dir = '~/Movies/TDLib Media Uploader/Videos'
image_dir = '~/Pictures/TDLib Media Uploader/Images'

# 可选：ExifTool 路径
# Windows 使用 tools/exiftool.exe，macOS/Linux 使用 tools/exiftool。
# 如果 ExifTool 不存在，程序仍会按 read_media_creation_date 设置尝试媒体日期，
# 最后按 missing_date_policy 回退，不会因为工具缺失直接中断。
exiftool_path = 'tools/exiftool'


[video]

# 视频上传页“编辑目标与配置”窗口可直接修改本段媒体选项。

extensions = [".mp4", ".mov", ".m4v"]

# 日期优先级：EXIF 信息 →（可选）媒体创建日期 → 文件修改日期。
# ExifTool 仍使用一次批量扫描；缺少 EXIF 的视频才会用 FFmpeg 读取媒体日期。
# 媒体日期最多同时读取 4 个文件，每个文件只启动一次 FFmpeg，并显示扫描进度。
# 如果扫描速度优先，可关闭 read_media_creation_date；关闭后仍会读取 EXIF。
#
# "error"：
# - 找不到可用的 EXIF 或媒体创建日期的视频会停止上传
# - 未安装 ExifTool 且关闭媒体日期回退时，无法读取 EXIF 的视频会停止上传
missing_date_policy = "mtime"

# 是否读取 MediaCreateDate、TrackCreateDate、QuickTime CreationDate 等媒体日期。
# true 保留旧版本的 QuickTime 日期读取行为；false 可进一步缩短扫描时间。
read_media_creation_date = true

quicktime_utc_target_zone = ""

# 视频分组方式：date=按媒体日期分组；fixed=按扫描顺序固定分组。
# 旧版 force_ten_per_album 仍可读取，但新配置请使用 group_mode。
group_mode = "date"

# 扫描顺序只能二选一：mtime=修改时间，name=文件名。
sort_mode = "mtime"

# 每组 1~10 个视频；按日期模式表示每个月上限，固定模式表示固定组大小。
album_size = 10

# 2 -> 21-5
# 4 -> 2021-5
caption_year_digits = 2

# 视频组标题默认使用日期或 Album 编号；可在 GUI 中编辑基础标题和追加文本。
album_caption_separator = " · "
# 是否显示默认组标题（如 Album 1、25-06）。
caption_include_group_title = true
# 是否在标题后附加当前组内的文件名。
caption_include_filenames = false
# 文件名列表是否带 1、2、3… 序号。
caption_include_filename_numbers = true

generate_thumbnail = true
thumb_max_edge = 320
thumb_target_kib = 80

show_file_list = true
verify_all_metadata_before_upload = false

# 仅在需要清空视频断点时临时改为 true
reset_state = false


[image]

# 图片上传页“编辑目标与配置”窗口可直接修改本段媒体选项。

extensions = [".jpg", ".jpeg", ".png", ".webp"]

album_size = 10

# 图片 Album 的统一 Caption 默认按 1、2、3…编号；可在 GUI 中为每个 Album 追加自定义文本。
album_numbering = true
album_number_start = 1
album_caption_separator = " · "
# 可选：在 Album Caption 的编号/自定义文本后附加当前 Album 内所有文件的“序号. 文件名”清单。
caption_include_filenames = false

# "mtime" = 按文件修改时间从旧到新
# "path"  = 按目录/文件名排序
sort_mode = "mtime"

show_file_list = true
verify_all_images_before_upload = false

# 图片超过 Telegram Photo 的 10 MiB 时，是否使用已有的 LGPL FFmpeg
# 生成临时 JPEG 副本后继续作为 Photo 上传。默认关闭；关闭时超限图片会在扫描阶段跳过。
# 原文件不会被修改。启用后如果 FFmpeg 不可用或无法压到安全大小，仍会跳过该图片。
compress_oversize = false

# 仅在需要清空图片断点时临时改为 true
reset_state = false


[tdlib]

# 一般无需修改
log_verbosity = 1
request_timeout_seconds = 120
message_send_timeout_seconds = 86400

database_encryption_key = ""

use_file_database = true
use_chat_info_database = true
use_message_database = false
