# ============================================================
# TDLib Media Uploader V1.9.1
#
# 首次使用：
#   1. 复制本文件为 data/config.toml
#   2. 填写 Telegram API、目标群/Topic 或频道和本地目录
#
# 各平台 setup / run 脚本在发现 data/config.toml 不存在时也会自动创建。
#
# 路径支持绝对路径和 ~；Windows 也可以使用单引号保存反斜杠。
# ============================================================


[telegram]

# 在 https://my.telegram.org/ 获取
api_id = 12345678
api_hash = "YOUR_API_HASH"

# Telegram 超级群 Chat ID，例如 -1001234567890
chat_id = -1001234567890

# Forum Topic ID
forum_topic_id = 12345

# 目标模式：forum_topic（超级群组话题）或 channel（频道）
target_mode = "forum_topic"

# 频道 Chat ID。选择 channel 时必须填写；选择 forum_topic 时可保持 0。
channel_chat_id = 0

# 可选：分别为视频、图片和混合上传覆盖 Telegram 目标。
# 未填写对应小节时，该上传类型继承上面 [telegram] 的公共目标。
# GUI 的三个上传页面也可以分别编辑这里的目标。
#
# [telegram.video]
# target_mode = "forum_topic"
# chat_id = -1001234567890
# channel_chat_id = 0
# forum_topic_id = 12345
#
# [telegram.image]
# target_mode = "channel"
# chat_id = -1001234567890
# channel_chat_id = -1009876543210
# forum_topic_id = 0
#
# [telegram.mixed]
# target_mode = "forum_topic"
# chat_id = -1001234567890
# channel_chat_id = 0
# forum_topic_id = 12345


[proxy]

# 独立的 Telegram 网络代理设置。默认关闭，关闭时使用直连。
# type 可选："socks5"、"http"、"mtproto"
enabled = false
type = "socks5"
server = ""
port = 1080

# SOCKS5 / HTTP 可选认证；MTProto 不使用下面两个字段。
username = ""
password = ""

# MTProto 代理的十六进制 secret；仅 type = "mtproto" 时填写。
secret = ""

# HTTP 代理只支持普通 HTTP 请求时设为 true；一般保持 false。
http_only = false


[paths]

# 会递归扫描所有子文件夹；相对路径以 data/ 为基准
video_dir = '~/Movies/TDLib Media Uploader/Videos'
image_dir = '~/Pictures/TDLib Media Uploader/Images'
# 混合上传目录；其下的一级子文件夹分别作为独立组
mixed_dir = '~/Movies/TDLib Media Uploader/Mixed'

# 可选：ExifTool 路径
# Windows 使用 tools/exiftool.exe，macOS/Linux 使用 tools/exiftool。
# 如果 ExifTool 不存在，程序仍会按 read_media_creation_date 设置尝试媒体日期，
# 最后按 missing_date_policy 回退，不会因为工具缺失直接中断。
exiftool_path = 'tools/exiftool'


[video]

# 视频上传页“编辑目标与配置”窗口可直接修改本段媒体选项。
# Telegram 视频单文件上限约为普通账号 2 GB、Premium 4 GB；程序按
# 4000/8000 个 512 KiB 分片计算精确字节边界，扫描和发送前都会检查。

extensions = [".mp4", ".mov", ".m4v"]

# 日期优先级：EXIF 信息 →（可选）媒体创建日期 → 文件修改日期。
# ExifTool 仍使用一次批量扫描；缺少 EXIF 的视频才会用 FFmpeg 读取媒体日期。
# 媒体日期最多同时读取 4 个文件，每个文件只启动一次 FFmpeg，并显示扫描进度。
# 如果只需要按文件名上传，可关闭 read_dates；关闭后跳过所有日期读取，
# 自动按文件名排序并按固定数量分组。read_media_creation_date 仅在 read_dates 开启时生效。
#
# "error"：
# - 找不到可用的 EXIF 或媒体创建日期的视频会停止上传
# - 未安装 ExifTool 且关闭媒体日期回退时，无法读取 EXIF 的视频会停止上传
missing_date_policy = "mtime"

# 是否读取视频日期信息。关闭后只按文件名扫描，不调用 ExifTool、FFmpeg 或文件修改时间。
read_dates = true

# 是否读取 MediaCreateDate、TrackCreateDate、QuickTime CreationDate 等媒体日期。
# true 保留旧版本的 QuickTime 日期读取行为；false 可进一步缩短扫描时间。
read_media_creation_date = true

quicktime_utc_target_zone = ""

# 视频分组方式：date=按媒体日期分组；fixed=按扫描顺序固定分组。
# 旧版 force_ten_per_album 仍可读取，但新配置请使用 group_mode。
group_mode = "date"

# 扫描顺序只能二选一：mtime=修改时间，name=文件名和目录（自然数字从小到大）。
sort_mode = "mtime"

# 每组 1~10 个视频；按日期模式表示每个月上限，固定模式表示固定组大小。
album_size = 10

# 2 -> 21-5
# 4 -> 2021-5
caption_year_digits = 2

# 视频组标题默认使用日期或 Album 编号；可在 GUI 中编辑基础标题和追加文本。
album_caption_separator = " · "
# 是否显示默认组标题（如 Album 1、25-06）。
caption_include_group_title = true
# 是否在标题后附加当前组内的文件名。
caption_include_filenames = false
# 文件名列表是否带 1、2、3… 序号。
caption_include_filename_numbers = true

generate_thumbnail = true
thumb_max_edge = 320
thumb_target_kib = 80

show_file_list = true
verify_all_metadata_before_upload = false

# 仅在需要清空视频断点时临时改为 true
reset_state = false


[mixed]

# 递归收集每个一级子文件夹中的图片和视频，混合组成 Album。
# 扩展名直接继承 [image].extensions 和 [video].extensions。
# name：按相对路径逐层自然排序（文件夹和文件名中的连续数字按整数从小到大）；mtime：按修改时间从旧到新排序，路径用于并列时排序。
sort_mode = "name"
album_size = 10
caption_include_group_title = true
caption_include_filenames = false
caption_include_filename_numbers = true
album_caption_separator = " · "
generate_thumbnail = true
verify_media_before_upload = false
reset_state = false


[staging]

# 可选：先把源文件复制到本地缓存，再交给 TDLib 读取，适合不稳定的 SMB/NAS。程序只清理自己的受管暂存文件。
# 断点仍以原始媒体路径为准；关闭时直接读取源文件。
enabled = false
mode = "off" # off=直接读取；network=仅网络盘暂存；always=所有文件暂存
directory = "cache/staging"
cleanup_on_start = true
cleanup_days = 7
cleanup_after_success = true


[scan]

# 文件必须在多次检查中保持大小和修改时间不变，才会进入媒体读取/上传。
# 检查次数和等待间隔都可调；网络盘建议保持默认或适当增加次数。
stability_checks = 2
stability_interval_seconds = 0.05
stability_checks_local = 2
stability_interval_local_seconds = 0.05
stability_checks_network = 3
stability_interval_network_seconds = 0.5
discovery_attempts = 3
discovery_initial_delay_seconds = 0.15
discovery_max_delay_seconds = 1.0
readiness_attempts = 3
read_probe_bytes = 65536

# 所有扫描/预检共用这两个并发上限；网络盘自动使用 network 值。
io_workers_local = 4
io_workers_network = 2


[process]

# ExifTool/FFmpeg 单次调用的最长时间（秒）。超时后会按现有重试/隔离策略处理。
# 未确认上传日志会额外记录 Telegram 目标和源文件快照；可在 GUI 的“未确认上传”页人工处理。
exiftool_timeout_seconds = 120
ffmpeg_metadata_timeout_seconds = 30
ffmpeg_info_timeout_seconds = 30
ffmpeg_thumbnail_timeout_seconds = 45
ffmpeg_compression_timeout_seconds = 45
exiftool_batch_size = 256
exiftool_retries = 2


[image]

# 图片上传页“编辑目标与配置”窗口可直接修改本段媒体选项。

extensions = [".jpg", ".jpeg", ".png", ".webp"]

album_size = 10

# 图片 Album 的统一 Caption 默认按 1、2、3…编号；可在 GUI 中为每个 Album 追加自定义文本。
album_numbering = true
album_number_start = 1
album_caption_separator = " · "
# 可选：在 Album Caption 的编号/自定义文本后附加当前 Album 内所有文件的“序号. 文件名”清单。
caption_include_filenames = false

# "mtime" = 按文件修改时间从旧到新
# "name"  = 按目录/文件名自然数字排序（数字从小到大）
# 旧版 "path" 会自动转换为 "name"。
sort_mode = "mtime"

show_file_list = true
verify_all_images_before_upload = false

# 图片超过 Telegram Photo 的 10 MiB 时，是否使用已有的 LGPL FFmpeg
# 生成临时 JPEG 副本后继续作为 Photo 上传。默认关闭；关闭时超限图片会在扫描阶段跳过。
# 原文件不会被修改。启用后如果 FFmpeg 不可用或无法压到安全大小，仍会跳过该图片。
compress_oversize = false

# 仅在需要清空图片断点时临时改为 true
reset_state = false


[tdlib]

# 登录数据库和文件缓存固定写入 data/telegram/database 与 data/telegram/files，
# 不会写入程序目录、资源目录或 PyInstaller _internal；复制整个 data/ 即可迁移登录状态。
log_verbosity = 1
request_timeout_seconds = 120
message_send_timeout_seconds = 86400

database_encryption_key = ""

use_file_database = true
use_chat_info_database = true
use_message_database = false
