# ============================================================
# TDLib Media Uploader V1.8.1
#
# 首次使用：
#   1. 复制本文件为 config.toml
#   2. 填写 Telegram API、目标群/Topic 或频道和本地目录
#
# setup.ps1 / run.ps1 在发现 config.toml 不存在时也会自动创建。
#
# Windows 路径建议使用单引号：
# video_dir = 'F:\Videos'
# 这样反斜杠不需要写成 \\。
# ============================================================


[telegram]

# 在 https://my.telegram.org/ 获取
api_id = 12345678
api_hash = "YOUR_API_HASH"

# Telegram 超级群 Chat ID，例如 -1001234567890
chat_id = -1001234567890

# Forum Topic ID
forum_topic_id = 12345

# 目标模式：forum_topic（超级群组话题）或 channel（频道）
target_mode = "forum_topic"

# 频道 Chat ID。选择 channel 时必须填写；选择 forum_topic 时可保持 0。
channel_chat_id = 0

# 可选：分别为视频和图片覆盖 Telegram 目标。
# 未填写对应小节时，该上传类型继承上面 [telegram] 的公共目标。
# GUI 的“视频上传”和“图片上传”页面也可以分别编辑这里的目标。
#
# [telegram.video]
# target_mode = "forum_topic"
# chat_id = -1001234567890
# channel_chat_id = 0
# forum_topic_id = 12345
#
# [telegram.image]
# target_mode = "channel"
# chat_id = -1001234567890
# channel_chat_id = -1009876543210
# forum_topic_id = 0


[proxy]

# 独立的 Telegram 网络代理设置。默认关闭，关闭时使用直连。
# type 可选："socks5"、"http"、"mtproto"
enabled = false
type = "socks5"
server = ""
port = 1080

# SOCKS5 / HTTP 可选认证；MTProto 不使用下面两个字段。
username = ""
password = ""

# MTProto 代理的十六进制 secret；仅 type = "mtproto" 时填写。
secret = ""

# HTTP 代理只支持普通 HTTP 请求时设为 true；一般保持 false。
http_only = false


[paths]

# 会递归扫描所有子文件夹
video_dir = 'F:\Videos'
image_dir = 'F:\Images'

# 可选：ExifTool 路径
# 如果 tools\exiftool.exe 不存在，且 missing_date_policy = "mtime"，
# 视频脚本会直接使用 Windows 修改时间，不会报错。
exiftool_path = 'tools\exiftool.exe'


[video]

# 视频上传页“编辑目标与配置”窗口可直接修改本段媒体选项。

extensions = [".mp4", ".mov", ".m4v"]

# 默认 mtime：
# - 安装 ExifTool 时：优先 EXIF/QuickTime 内部时间，缺失时用 Windows 修改时间
# - 未安装 ExifTool 时：全部使用 Windows 修改时间
#
# "error"：
# - 必须安装 ExifTool
# - 找不到内部日期的视频会停止上传
missing_date_policy = "mtime"

quicktime_utc_target_zone = ""

# Telegram 一个媒体组最多 10 个
album_size = 10

# 2 -> 21-5
# 4 -> 2021-5
caption_year_digits = 2

# 每个视频 Album 的统一 Caption 默认使用日期标题；可在 GUI 中编辑基础标题和追加文本。
album_caption_separator = " · "
# 可选：在 Album Caption 后附加当前 Album 内所有文件的“序号. 文件名”清单。
caption_include_filenames = false

generate_thumbnail = true
thumb_max_edge = 320
thumb_target_kib = 80

show_file_list = true
verify_all_metadata_before_upload = false

# 仅在需要清空视频断点时临时改为 true
reset_state = false


[image]

# 图片上传页“编辑目标与配置”窗口可直接修改本段媒体选项。

extensions = [".jpg", ".jpeg", ".png", ".webp"]

album_size = 10

# 图片 Album 的统一 Caption 默认按 1、2、3…编号；可在 GUI 中为每个 Album 追加自定义文本。
album_numbering = true
album_number_start = 1
album_caption_separator = " · "
# 可选：在 Album Caption 的编号/自定义文本后附加当前 Album 内所有文件的“序号. 文件名”清单。
caption_include_filenames = false

# "mtime" = 按 Windows 修改时间从旧到新
# "path"  = 按目录/文件名排序
sort_mode = "mtime"

show_file_list = true
verify_all_images_before_upload = false

# 仅在需要清空图片断点时临时改为 true
reset_state = false


[tdlib]

# 一般无需修改
log_verbosity = 1
request_timeout_seconds = 120
message_send_timeout_seconds = 86400

database_encryption_key = ""

use_file_database = true
use_chat_info_database = true
use_message_database = false
