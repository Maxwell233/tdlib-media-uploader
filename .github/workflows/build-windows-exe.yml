name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: PyInstaller Windows build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade --force-reinstall --no-binary imageio-ffmpeg -r requirements-build.txt

      - name: Build one-folder EXE
        shell: pwsh
        run: .\build_exe.ps1 -SkipInstall -Clean -PythonPath "python"

      - name: Validate build output
        shell: pwsh
        run: |
          $exe = "dist\TDLib Media Uploader\TDLib Media Uploader.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "EXE not found: $exe"
          }
          foreach ($noticeName in @("LICENSE", "ATTRIBUTION", "THIRD_PARTY_LICENSES.md")) {
            $notice = "dist\TDLib Media Uploader\$noticeName"
            if (-not (Test-Path -LiteralPath $notice)) {
              throw "License/attribution manifest not found: $notice"
            }
          }
          $ffmpeg = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          $ffmpegLicense = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "LICENSE.txt" -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffmpegLicense) {
            throw "LGPL FFmpeg or its license file was not included in the portable build"
          }
          $ffmpegVersion = (& $ffmpeg.FullName "-version" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -match "--enable-gpl" -or $ffmpegVersion -match "--enable-nonfree") {
            throw "Portable build contains an invalid GPL/nonfree FFmpeg binary"
          }
          $archive = Get-ChildItem -LiteralPath "dist" -Filter "*.zip" | Select-Object -First 1
          if ($null -eq $archive) {
            throw "Portable ZIP not found in dist"
          }
          Write-Host "Validated: $exe"
          Write-Host "Validated: $($archive.FullName)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-media-uploader-${{ github.ref_name }}-windows-x64
          path: dist/TDLib Media Uploader-v*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -LiteralPath ".\VERSION").Trim()
          $archive = Get-ChildItem -LiteralPath "dist" -Filter "TDLib Media Uploader-v*.zip" | Select-Object -First 1
          if ($null -eq $archive) {
            throw "Portable ZIP not found in dist"
          }
          $notes = @(
            "## TDLib Media Uploader v$version"
            ""
            "Windows x64 PySide6 one-folder build."
            ""
            "- Includes TDLib, a verified BtbN Windows x64 LGPL FFmpeg build, and Qt runtime dependencies."
            "- FFmpeg asset: autobuild-2026-09-03-13-17; no --enable-gpl/nonfree build flags."
            "- Hides Windows console windows while scanning, pre-checking videos, and generating covers."
            "- Registers the application icon in the GUI and taskbar."
            "- Adds optional TDLib-native SOCKS5, HTTP, and MTProto proxy settings; disabled by default and direct-connected when off."
            "- Supports selecting a supergroup Forum Topic or a Channel as the upload target."
            "- Allows separate Telegram targets for video and image uploads; each upload page shows and edits its own target."
            "- Moves video/image Album, Caption, filename-list, sorting, and thumbnail options into the matching upload page target editor."
            "- Numbers photo Albums by default and allows per-Album custom text."
            "- Keeps video date grouping and allows editing each Album's base title and custom text."
            "- Adds optional numbered filename descriptions to each Album caption; disabled by default."
            "- Includes the CC BY-NC 4.0 license and Maximum attribution."
            "- Adds an optional strict video mode that ignores dates and groups videos in batches of ten; disabled by default."
            "- Caches repeated file-size lookups during GUI scans to reduce blocking stat calls on large or SMB-backed directories."
            "- Handles Windows UNC/SMB paths without resolving the share for scan identities and skips temporarily unavailable entries with a warning."
            "- Includes THIRD_PARTY_LICENSES.md with upstream license and redistribution notes."
            "- `config.toml` and Telegram login data are not included."
            "- Unzip the package and run `TDLib Media Uploader.exe`."
            ""
            "Author attribution: Maximum (2026)."
          )
          $notes | Set-Content -LiteralPath ".\release-notes.md" -Encoding utf8
          $existing = gh release view $env:GITHUB_REF_NAME --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Replacing existing release $env:GITHUB_REF_NAME"
            gh release delete $env:GITHUB_REF_NAME --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to remove existing release: $env:GITHUB_REF_NAME"
            }
          }
          gh release create $env:GITHUB_REF_NAME $archive.FullName `
            --title "TDLib Media Uploader v$version" `
            --notes-file ".\release-notes.md" `
            --latest
