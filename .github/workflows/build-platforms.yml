name: Build Windows and macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: PyInstaller Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade --force-reinstall --no-binary imageio-ffmpeg -r requirements-build.txt

      - name: Run offline regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build one-folder EXE
        shell: pwsh
        run: .\build_exe.ps1 -SkipInstall -Clean -PythonPath "python"

      - name: Validate Windows x64 package
        shell: pwsh
        run: |
          $exe = "dist\TDLib Media Uploader\TDLib Media Uploader.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "EXE not found: $exe"
          }
          $appIcon = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "tdlib_media_uploader_icon.ico" -File -Recurse | Select-Object -First 1
          if ($null -eq $appIcon) {
            throw "Windows Qt/taskbar icon resource not found in the packaged application"
          }
          foreach ($noticeName in @("LICENSE", "ATTRIBUTION", "THIRD_PARTY_LICENSES.md")) {
            $notice = "dist\TDLib Media Uploader\$noticeName"
            if (-not (Test-Path -LiteralPath $notice)) {
              throw "License/attribution manifest not found: $notice"
            }
          }
          $ffmpeg = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          $ffmpegLicense = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "LICENSE.txt" -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffmpegLicense) {
            throw "LGPL FFmpeg or its license file was not included in the portable build"
          }
          $ffmpegVersion = (& $ffmpeg.FullName "-version" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -match "--enable-gpl" -or $ffmpegVersion -match "--enable-nonfree") {
            throw "Portable build contains an invalid GPL/nonfree FFmpeg binary"
          }
          $archive = Get-ChildItem -LiteralPath "dist" -Filter "TDLib Media Uploader-v*.zip" | Select-Object -First 1
          if ($null -eq $archive) {
            throw "Portable ZIP not found in dist"
          }
          Write-Host "Validated: $exe"
          Write-Host "Validated: $($archive.FullName)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-media-uploader-${{ github.ref_name }}-windows-x64
          path: dist/TDLib Media Uploader-v*.zip
          if-no-files-found: error
          retention-days: 30

  build-macos-arm64:
    name: PyInstaller macOS arm64 build
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Set up Python 3.13 arm64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: bash
        run: |
          python -m venv .build_venv
          .build_venv/bin/python -m pip install --upgrade pip
          .build_venv/bin/python -m pip install --no-cache-dir --upgrade --force-reinstall --no-binary imageio-ffmpeg -r requirements-build.txt

      - name: Run offline regression tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: .build_venv/bin/python -m unittest discover -s tests -v

      - name: Build macOS arm64 app
        shell: bash
        run: ./build_macos.sh --clean --skip-install

      - name: Validate macOS arm64 package
        shell: bash
        run: |
          APP="dist/TDLib Media Uploader.app"
          EXECUTABLE="$APP/Contents/MacOS/TDLib Media Uploader"
          test -x "$EXECUTABLE"
          file "$EXECUTABLE" | grep -q arm64
          FFMPEG="$(find "$APP" -type f -name ffmpeg -perm -111 -print -quit)"
          test -n "$FFMPEG"
          file "$FFMPEG" | grep -q arm64
          "$FFMPEG" -version | tee ffmpeg-version.txt
          ! grep -q -- "--enable-gpl\|--enable-nonfree" ffmpeg-version.txt
          for notice in LICENSE ATTRIBUTION THIRD_PARTY_LICENSES.md; do
            test -f "$APP/Contents/Resources/$notice" || test -f "$APP/$notice"
          done
          test -f dist/TDLib\ Media\ Uploader-v*-macos-arm64.zip
          test -f dist/TDLib\ Media\ Uploader-v*-macos-arm64.zip.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-media-uploader-${{ github.ref_name }}-macos-arm64
          path: |
            dist/TDLib Media Uploader-v*-macos-arm64.zip
            dist/TDLib Media Uploader-v*-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish combined release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tdlib-media-uploader-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          archives=(release-assets/*.zip)
          test "${#archives[@]}" -eq 2
          : > release-assets/SHA256SUMS
          for archive in "${archives[@]}"; do
            shasum -a 256 "$archive" >> release-assets/SHA256SUMS
          done
          version="$(tr -d '[:space:]' < VERSION)"
          cat > release-notes.md <<'EOF'
          ## TDLib Media Uploader v__VERSION__

          此版本由同一份远程源码同时构建两个平台：Windows x64 和 macOS Apple Silicon arm64；两者使用同一套 GUI、上传核心和功能配置。

          - Windows：解压后运行 `TDLib Media Uploader.exe`。
          - macOS：解压后打开 `TDLib Media Uploader.app`；首次打开若遇到系统安全提示，请确认下载来源和 SHA-256 后右键点按“打开”。
          - 发布包包含许可、署名、第三方清单以及 macOS FFmpeg 构建信息。
          - 项目原创代码、文档和界面资源采用 GNU GPL v3.0 only（GPL-3.0-only）；第三方组件仍遵循各自上游许可证。
          - 使用 `SHA256SUMS` 校验下载文件完整性。

          风险提示：当前发布包未配置 Apple Developer 签名/公证，因此 macOS Gatekeeper 可能提示无法验证开发者；未签名不等于安全认证。请只从本仓库 Release 下载，先核对 SHA-256，并在使用前阅读源码和许可文件。程序会保存 Telegram 登录数据、API 凭据相关配置和上传断点到本机，不会把这些个人文件放入发布包；请勿分享 `config.toml`、登录数据库或 API Hash。上传行为、代理和目标权限由用户自行确认，并应遵守 Telegram 条款及目标群组规则。
          EOF
          sed -i "s/__VERSION__/${version}/g" release-notes.md

      - name: Publish combined GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*.zip release-assets/SHA256SUMS --clobber
            gh release edit "$tag" --title "TDLib Media Uploader v${version}" --notes-file release-notes.md --latest
          else
            gh release create "$tag" release-assets/*.zip release-assets/SHA256SUMS \
              --title "TDLib Media Uploader v${version}" \
              --notes-file release-notes.md \
              --latest
          fi
