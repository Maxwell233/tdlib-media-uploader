name: Build Windows and macOS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: PyInstaller Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build-lock.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade --force-reinstall --no-binary imageio-ffmpeg -r requirements-build-lock.txt
          python -m pip check

      - name: Run offline regression tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build one-folder EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectDir = (Get-Location).Path
          $version = (Get-Content -Raw -LiteralPath ".\VERSION").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "VERSION 文件为空。" }

          $ffmpegTag = "autobuild-2026-09-15-13-18"
          $ffmpegArchiveName = "ffmpeg-N-126574-g912208af28-win64-lgpl.zip"
          $ffmpegSha256 = "2225d99bdd642ba615fb1c8fda94a915f40ea146a6a8e0739c486ebe745d6f6c"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$ffmpegTag/$ffmpegArchiveName"
          $ffmpegStage = Join-Path $projectDir "tools\ffmpeg"
          $ffmpegPath = Join-Path $ffmpegStage "ffmpeg.exe"
          $ffmpegLicensePath = Join-Path $ffmpegStage "LICENSE.txt"
          $ffmpegTemp = Join-Path $env:RUNNER_TEMP "tdlib-media-uploader-ffmpeg"
          $archivePath = Join-Path $ffmpegTemp $ffmpegArchiveName
          $extractPath = Join-Path $ffmpegTemp ("extract-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $ffmpegTemp | Out-Null

          try {
            if (Test-Path -LiteralPath $archivePath) {
              $cachedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
              if ($cachedHash -ne $ffmpegSha256) { Remove-Item -LiteralPath $archivePath -Force }
            }
            if (-not (Test-Path -LiteralPath $archivePath)) {
              Invoke-WebRequest -Uri $ffmpegUrl -OutFile $archivePath -UseBasicParsing
            }
            $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
            if ($archiveHash -ne $ffmpegSha256) { throw "FFmpeg 压缩包 SHA-256 校验失败：$archiveHash" }

            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
            $sourceFfmpeg = Get-ChildItem -LiteralPath $extractPath -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
            $sourceLicense = Get-ChildItem -LiteralPath $extractPath -Filter "LICENSE.txt" -File -Recurse | Select-Object -First 1
            if ($null -eq $sourceFfmpeg -or $null -eq $sourceLicense) {
              throw "FFmpeg 压缩包缺少 ffmpeg.exe 或 LICENSE.txt"
            }
            New-Item -ItemType Directory -Force -Path $ffmpegStage | Out-Null
            Copy-Item -LiteralPath $sourceFfmpeg.FullName -Destination $ffmpegPath -Force
            Copy-Item -LiteralPath $sourceLicense.FullName -Destination $ffmpegLicensePath -Force
          }
          finally {
            if (Test-Path -LiteralPath $extractPath) { Remove-Item -LiteralPath $extractPath -Recurse -Force }
          }

          $ffmpegVersion = (& $ffmpegPath "-version" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -match "--enable-gpl" -or $ffmpegVersion -match "--enable-nonfree") {
            throw "FFmpeg 不是可再分发的 LGPL 构建。"
          }
          $ffmpegLicense = Get-Content -Raw -LiteralPath $ffmpegLicensePath
          if ($ffmpegLicense -notmatch "LESSER GENERAL PUBLIC LICENSE") { throw "FFmpeg 许可文件不是 LGPL 文本。" }

          Remove-Item -LiteralPath ".\build", ".\dist" -Recurse -Force -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean --distpath ".\dist" --workpath ".\build" ".\tdlib_media_uploader.spec"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 构建失败。" }

          $distDir = Join-Path $projectDir "dist\TDLib Media Uploader"
          $exePath = Join-Path $distDir "TDLib Media Uploader.exe"
          if (-not (Test-Path -LiteralPath $exePath)) { throw "找不到构建后的 EXE：$exePath" }
          foreach ($noticeName in @("LICENSE", "ATTRIBUTION", "THIRD_PARTY_LICENSES.md")) {
            Copy-Item -LiteralPath (Join-Path $projectDir $noticeName) -Destination (Join-Path $distDir $noticeName) -Force
          }
          $zipPath = Join-Path $projectDir "dist\TDLib Media Uploader-v$version-windows-x64.zip"
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $distDir "*") -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Run packaged self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path -LiteralPath "dist\TDLib Media Uploader\TDLib Media Uploader.exe").Path
          if (-not (Test-Path -LiteralPath $exe)) { throw "EXE not found: $exe" }
          $stdoutPath = Join-Path $env:RUNNER_TEMP "tdlib-self-test.stdout"
          $stderrPath = Join-Path $env:RUNNER_TEMP "tdlib-self-test.stderr"
          Remove-Item -LiteralPath $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test") -Wait -PassThru `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          $stdout = if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath -Raw } else { "" }
          $stderr = if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath -Raw } else { "" }
          if ($stdout) { Write-Output $stdout }
          if ($stderr) { Write-Output $stderr }
          if ($process.ExitCode -ne 0) { throw "Packaged Windows self-test failed: $($process.ExitCode)" }

      - name: Validate Windows x64 package
        shell: pwsh
        run: |
          $exe = "dist\TDLib Media Uploader\TDLib Media Uploader.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "EXE not found: $exe"
          }
          $appIcon = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "tdlib_media_uploader_icon.ico" -File -Recurse | Select-Object -First 1
          if ($null -eq $appIcon) {
            throw "Windows Qt/taskbar icon resource not found in the packaged application"
          }
          Add-Type -AssemblyName System.Drawing
          $embeddedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path -LiteralPath $exe).Path)
          if ($null -eq $embeddedIcon) {
            throw "Windows EXE does not contain an extractable embedded icon resource"
          }
          $embeddedIcon.Dispose()
          foreach ($noticeName in @("LICENSE", "ATTRIBUTION", "THIRD_PARTY_LICENSES.md")) {
            $notice = "dist\TDLib Media Uploader\$noticeName"
            if (-not (Test-Path -LiteralPath $notice)) {
              throw "License/attribution manifest not found: $notice"
            }
          }
          $ffmpeg = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "ffmpeg.exe" -File -Recurse | Select-Object -First 1
          $ffmpegLicense = Get-ChildItem -LiteralPath "dist\TDLib Media Uploader" -Filter "LICENSE.txt" -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffmpegLicense) {
            throw "LGPL FFmpeg or its license file was not included in the portable build"
          }
          $ffmpegVersion = (& $ffmpeg.FullName "-version" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -match "--enable-gpl" -or $ffmpegVersion -match "--enable-nonfree") {
            throw "Portable build contains an invalid GPL/nonfree FFmpeg binary"
          }
          $archive = Get-ChildItem -LiteralPath "dist" -Filter "TDLib Media Uploader-v*.zip" | Select-Object -First 1
          if ($null -eq $archive) {
            throw "Portable ZIP not found in dist"
          }
          Write-Host "Validated: $exe"
          Write-Host "Validated: $($archive.FullName)"

      - name: Compute Windows artifact label
        id: windows_artifact
        shell: pwsh
        run: |
          $label = "${{ github.event.pull_request.number || github.ref_name }}".Replace("/", "-")
          "label=$label" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-media-uploader-${{ steps.windows_artifact.outputs.label }}-windows-x64
          path: dist/TDLib Media Uploader-v*.zip
          if-no-files-found: error
          retention-days: 30

  build-macos-arm64:
    name: PyInstaller macOS arm64 build
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Set up Python 3.13 arm64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-build-lock.txt

      - name: Install build dependencies
        shell: bash
        run: |
          python -m venv .build_venv
          .build_venv/bin/python -m pip install --upgrade pip
          .build_venv/bin/python -m pip install --no-cache-dir --upgrade --force-reinstall --no-binary imageio-ffmpeg -r requirements-build-lock.txt
          .build_venv/bin/python -m pip check

      - name: Run offline regression tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: .build_venv/bin/python -m unittest discover -s tests -v

      - name: Build macOS arm64 app
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_DIR="$PWD"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_PYTHON="$PROJECT_DIR/.build_venv/bin/python"
          BUILD_DIR="$PROJECT_DIR/build"
          DIST_DIR="$PROJECT_DIR/dist"
          FFMPEG_VERSION="7.1.1"
          FFMPEG_ARCHIVE="ffmpeg-${FFMPEG_VERSION}.tar.xz"
          FFMPEG_URL="https://ffmpeg.org/releases/${FFMPEG_ARCHIVE}"
          FFMPEG_SOURCE_SHA256="733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1"
          FFMPEG_WORK_DIR="$BUILD_DIR/ffmpeg-${FFMPEG_VERSION}"
          FFMPEG_STAGE_DIR="$PROJECT_DIR/tools/ffmpeg"
          rm -rf "$BUILD_DIR" "$DIST_DIR"
          mkdir -p "$BUILD_DIR"

          ensure_lgpl_ffmpeg() {
            local ffmpeg_path="$FFMPEG_STAGE_DIR/ffmpeg"
            local license_path="$FFMPEG_STAGE_DIR/LICENSE.txt"
            local version_output=""
            if [[ -x "$ffmpeg_path" && -f "$license_path" ]] && grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$license_path"; then
              version_output="$("$ffmpeg_path" -version 2>&1 || true)"
              if [[ "$version_output" != *"--enable-gpl"* && "$version_output" != *"--enable-nonfree"* && "$(file -b "$ffmpeg_path")" == *"arm64"* ]]; then
                return
              fi
            fi

            local cache_dir="$BUILD_DIR/ffmpeg-cache"
            local archive_path="$cache_dir/$FFMPEG_ARCHIVE"
            mkdir -p "$cache_dir"
            if [[ -f "$archive_path" ]]; then
              local cached_hash
              cached_hash="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
              [[ "$cached_hash" == "$FFMPEG_SOURCE_SHA256" ]] || rm -f "$archive_path"
            fi
            if [[ ! -f "$archive_path" ]]; then
              curl --fail --location --retry 3 --retry-delay 2 --output "$archive_path" "$FFMPEG_URL"
            fi
            local archive_hash
            archive_hash="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
            [[ "$archive_hash" == "$FFMPEG_SOURCE_SHA256" ]] || { echo "FFmpeg 源码归档校验失败：$archive_hash" >&2; exit 1; }

            rm -rf "$FFMPEG_WORK_DIR"
            mkdir -p "$FFMPEG_WORK_DIR"
            tar -xJf "$archive_path" -C "$FFMPEG_WORK_DIR"
            local source_dir="$FFMPEG_WORK_DIR/ffmpeg-${FFMPEG_VERSION}"
            local install_dir="$FFMPEG_WORK_DIR/install"
            mkdir -p "$install_dir"
            (
              cd "$source_dir"
              ./configure --prefix="$install_dir" --disable-debug --disable-doc --disable-ffplay --disable-ffprobe --disable-gpl --disable-nonfree --enable-version3 --enable-static --disable-shared
              make -j"$(sysctl -n hw.ncpu)"
              make install
            )
            grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$source_dir/COPYING.LGPLv3"
            mkdir -p "$FFMPEG_STAGE_DIR"
            cp "$install_dir/bin/ffmpeg" "$ffmpeg_path"
            cp "$source_dir/COPYING.LGPLv3" "$license_path"
            cat > "$FFMPEG_STAGE_DIR/BUILD_INFO.txt" <<EOF
          FFmpeg version: ${FFMPEG_VERSION}
          Source archive: ${FFMPEG_URL}
          Source archive SHA-256: ${FFMPEG_SOURCE_SHA256}
          Target architecture: macOS arm64
          Configure: --disable-gpl --disable-nonfree --enable-version3 --enable-static --disable-shared
          License file: COPYING.LGPLv3 from the source archive
          EOF
          }

          make_icon() {
            local iconset="$BUILD_DIR/tdlib_media_uploader.iconset"
            local icon_path="$BUILD_DIR/tdlib_media_uploader_icon.icns"
            rm -rf "$iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" assets/tdlib_media_uploader_icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
              sips -z "$((size * 2))" "$((size * 2))" assets/tdlib_media_uploader_icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            if iconutil -c icns "$iconset" -o "$icon_path" >/dev/null 2>&1; then printf '%s\n' "$icon_path"; fi
          }

          ensure_lgpl_ffmpeg
          ICON_PATH="$(make_icon)"
          export PYINSTALLER_CONFIG_DIR="$BUILD_DIR/pyinstaller-config"
          TDLIB_MACOS_ICON_PATH="$ICON_PATH" "$BUILD_PYTHON" -m PyInstaller --noconfirm --clean --distpath "$DIST_DIR" --workpath "$BUILD_DIR/pyinstaller" "$PROJECT_DIR/tdlib_media_uploader.spec"

          APP_PATH="$DIST_DIR/TDLib Media Uploader.app"
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/TDLib Media Uploader"
          test -x "$APP_EXECUTABLE"
          [[ "$(file -b "$APP_EXECUTABLE")" == *"arm64"* ]]
          PACKAGED_FFMPEG="$(find "$APP_PATH" -type f -name ffmpeg -perm -111 -print -quit)"
          test -n "$PACKAGED_FFMPEG"
          FFMPEG_OUTPUT="$("$PACKAGED_FFMPEG" -version 2>&1 || true)"
          [[ "$FFMPEG_OUTPUT" != *"--enable-gpl"* && "$FFMPEG_OUTPUT" != *"--enable-nonfree"* ]]
          [[ "$(file -b "$PACKAGED_FFMPEG")" == *"arm64"* ]]
          for notice in LICENSE ATTRIBUTION THIRD_PARTY_LICENSES.md; do
            cp "$PROJECT_DIR/$notice" "$APP_PATH/Contents/Resources/$notice" 2>/dev/null || cp "$PROJECT_DIR/$notice" "$APP_PATH/$notice"
          done

          PACKAGE_NAME="TDLib Media Uploader-v${VERSION}-macos-arm64"
          DMG_STAGE_DIR="$BUILD_DIR/dmg/$PACKAGE_NAME"
          DMG_PATH="$DIST_DIR/${PACKAGE_NAME}.dmg"
          rm -rf "$DMG_STAGE_DIR" "$DMG_PATH" "$DMG_PATH.sha256"
          mkdir -p "$DMG_STAGE_DIR"
          cp -R "$APP_PATH" "$DMG_STAGE_DIR/"
          ln -s /Applications "$DMG_STAGE_DIR/Applications"
          for notice in LICENSE ATTRIBUTION THIRD_PARTY_LICENSES.md; do cp "$PROJECT_DIR/$notice" "$DMG_STAGE_DIR/"; done
          [[ ! -f "$FFMPEG_STAGE_DIR/BUILD_INFO.txt" ]] || cp "$FFMPEG_STAGE_DIR/BUILD_INFO.txt" "$DMG_STAGE_DIR/FFMPEG_BUILD_INFO.txt"
          for attempt in 1 2 3 4 5; do
            rm -f "$DMG_PATH"
            if hdiutil create -volname "TDLib Media Uploader V${VERSION}" -srcfolder "$DMG_STAGE_DIR" -ov -format UDZO "$DMG_PATH"; then break; fi
            [[ "$attempt" == 5 ]] && exit 1
            sleep "$((2 ** attempt))"
          done
          (cd "$DIST_DIR" && shasum -a 256 "$(basename "$DMG_PATH")" > "$(basename "$DMG_PATH").sha256")

      - name: Run packaged self-test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="dist/TDLib Media Uploader.app"
          EXECUTABLE="$APP/Contents/MacOS/TDLib Media Uploader"
          test -x "$EXECUTABLE"
          "$EXECUTABLE" --self-test

      - name: Validate macOS arm64 package
        shell: bash
        run: |
          APP="dist/TDLib Media Uploader.app"
          EXECUTABLE="$APP/Contents/MacOS/TDLib Media Uploader"
          test -x "$EXECUTABLE"
          file "$EXECUTABLE" | grep -q arm64
          FFMPEG="$(find "$APP" -type f -name ffmpeg -perm -111 -print -quit)"
          test -n "$FFMPEG"
          file "$FFMPEG" | grep -q arm64
          "$FFMPEG" -version | tee ffmpeg-version.txt
          ! grep -q -- "--enable-gpl\|--enable-nonfree" ffmpeg-version.txt
          for notice in LICENSE ATTRIBUTION THIRD_PARTY_LICENSES.md; do
            test -f "$APP/Contents/Resources/$notice" || test -f "$APP/$notice"
          done
          DMG="$(find dist -maxdepth 1 -type f -name 'TDLib Media Uploader-v*-macos-arm64.dmg' -print -quit)"
          test -n "$DMG"
          test -f "$DMG.sha256"
          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true
            rmdir "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_POINT" >/dev/null
          test -d "$MOUNT_POINT/TDLib Media Uploader.app"
          test -L "$MOUNT_POINT/Applications"

      - name: Compute macOS artifact label
        id: macos_artifact
        shell: bash
        run: |
          label="${{ github.event.pull_request.number || github.ref_name }}"
          echo "label=${label//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: tdlib-media-uploader-${{ steps.macos_artifact.outputs.label }}-macos-arm64
          path: |
            dist/TDLib Media Uploader-v*-macos-arm64.dmg
            dist/TDLib Media Uploader-v*-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish combined release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tdlib-media-uploader-${{ github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          archives=(release-assets/*.zip release-assets/*.dmg)
          test "${#archives[@]}" -eq 2
          : > release-assets/SHA256SUMS
          for archive in "${archives[@]}"; do
            shasum -a 256 "$archive" >> release-assets/SHA256SUMS
          done
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "GitHub tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          if [[ -f RELEASE_NOTES.md ]]; then
            # Keep the release page focused on this build.  The full history
            # remains in CHANGELOG.md and is not copied into every release.
            changelog_notes="$(cat RELEASE_NOTES.md)"
          else
            changelog_notes="$(awk -v version="$version" '
              $0 == "## " version { found=1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)"
          fi
          if [[ -z "${changelog_notes//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md 中没有找到 ${version} 的更新章节" >&2
            exit 1
          fi
          {
            printf '%s\n\n' "$changelog_notes"
            cat <<'EOF'
          ### 发布包

          - Windows：下载 x64 ZIP，解压后运行 `TDLib Media Uploader.exe`。
          - macOS：下载 Apple Silicon arm64 DMG，把 `TDLib Media Uploader.app` 拖到其中的 `Applications` 文件夹。
          - 使用 `SHA256SUMS` 校验下载文件完整性；macOS 包未配置 Apple Developer 签名和公证。
          EOF
          } > release-notes.md

      - name: Publish combined GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="$GITHUB_REF_NAME"
          release_flags=(--title "V${version}" --notes-file release-notes.md)
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*.zip release-assets/*.dmg release-assets/SHA256SUMS --clobber
            gh release edit "$tag" "${release_flags[@]}"
          else
            gh release create "$tag" release-assets/*.zip release-assets/*.dmg release-assets/SHA256SUMS \
              "${release_flags[@]}"
          fi
